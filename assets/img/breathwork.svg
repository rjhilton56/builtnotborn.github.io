    <circle cx="400" cy="300" r="205" stroke-opacity="0.15"/>
    <circle cx="400" cy="300" r="175" stroke-opacity="0.3"/>
    <circle cx="400" cy="300" r="175" stroke-opacity="0.55" stroke-dasharray="4 18" stroke-linecap="round"/>
  </g>
  <!-- phase ticks -->
  <g fill="#E8A33D">
    <rect x="398" y="112" width="4" height="16" rx="2"/>
    <rect x="398" y="472" width="4" height="16" rx="2" opacity="0.5"/>
    <rect x="212" y="298" width="16" height="4" rx="2" opacity="0.5"/>
    <rect x="572" y="298" width="16" height="4" rx="2" opacity="0.5"/>
  </g>
  <circle cx="400" cy="300" r="120" fill="url(#core)"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#0A0A0B" stroke-opacity="0.25" stroke-width="2"/>
  <text x="400" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="7" fill="#0A0A0B">BREATHE</text>
  <text x="403" y="322" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#0A0A0B" opacity="0.75">in · 4</text>
  <text x="400" y="546" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="6" fill="#8A8580">BOX · CALM · COMBO STACK</text>
  <g fill="#E8A33D">
