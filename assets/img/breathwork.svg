<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a glowing molten breathing orb surrounded by concentric guide rings">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100e0c"/><stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#ffdea0"/><stop offset="0.42" stop-color="#E8A33D"/>
      <stop offset="0.75" stop-color="#9A6314"/><stop offset="1" stop-color="#5b3a0b"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.35"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bbg)"/>
  <circle cx="400" cy="300" r="280" fill="url(#halo)"/>
  <g fill="none" stroke="#C8841E">
