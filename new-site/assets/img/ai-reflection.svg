<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a handwritten journal entry becoming an AI coaching reflection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141210"/><stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#C8841E" stop-opacity="0.22"/><stop offset="1" stop-color="#C8841E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A6314"/><stop offset="0.5" stop-color="#E8A33D"/><stop offset="1" stop-color="#9A6314"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dc"/><stop offset="1" stop-color="#ddd5c2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- paper page -->
  <g transform="translate(70 120) rotate(-3)">
    <rect width="280" height="360" rx="6" fill="url(#paper)"/>
    <g stroke="#8a7a5c" stroke-opacity="0.35" stroke-width="1">
      <line x1="30" y1="80" x2="250" y2="80"/><line x1="30" y1="116" x2="250" y2="116"/>
      <line x1="30" y1="152" x2="250" y2="152"/><line x1="30" y1="188" x2="250" y2="188"/>
      <line x1="30" y1="224" x2="250" y2="224"/><line x1="30" y1="260" x2="250" y2="260"/>
      <line x1="30" y1="296" x2="250" y2="296"/>
    </g>
    <text x="30" y="50" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8a7a5c">DAILY CHECK-IN</text>
    <g stroke="#3a332a" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M34 72 q14 -12 26 -2 q10 8 24 -4 q12 -8 26 0 q13 8 27 -2 q12 -8 26 2 q12 8 24 -2"/>
      <path d="M34 108 q16 -10 30 -1 q12 7 26 -4 q14 -9 28 1 q12 8 26 -3 q12 -8 24 1"/>
      <path d="M34 144 q13 -11 27 -2 q11 8 25 -3 q13 -9 27 0 q12 8 26 -2 q13 -9 27 1 q10 7 22 -1"/>
      <path d="M34 180 q15 -9 29 0 q11 7 25 -4 q14 -8 28 0 q12 8 24 -2"/>
      <path d="M34 216 q14 -12 28 -2 q10 8 24 -3 q13 -9 27 0 q13 8 27 -2 q12 -8 24 1"/>
    </g>
  </g>
  <!-- scan beam -->
  <g>
    <rect x="360" y="286" width="120" height="2" fill="url(#gold)" opacity="0.9"/>
    <polygon points="480,279 496,287 480,295" fill="#E8A33D"/>
  </g>
  <!-- app reflection card -->
  <g transform="translate(430 110)">
    <rect width="300" height="380" rx="14" fill="#17140f" stroke="#C8841E" stroke-opacity="0.45"/>
    <rect x="1" y="1" width="298" height="2" rx="1" fill="url(#gold)" opacity="0.7"/>
    <circle cx="34" cy="42" r="4" fill="#E8A33D"/>
    <text x="50" y="47" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#C8841E">FORGE REFLECTION</text>
    <g fill="#8A8580">
      <rect x="30" y="80" width="240" height="7" rx="3.5" opacity="0.85"/>
      <rect x="30" y="104" width="214" height="7" rx="3.5" opacity="0.7"/>
      <rect x="30" y="128" width="232" height="7" rx="3.5" opacity="0.8"/>
      <rect x="30" y="152" width="180" height="7" rx="3.5" opacity="0.6"/>
      <rect x="30" y="188" width="240" height="7" rx="3.5" fill="#E8A33D" opacity="0.85"/>
      <rect x="30" y="212" width="204" height="7" rx="3.5" fill="#E8A33D" opacity="0.65"/>
      <rect x="30" y="248" width="226" height="7" rx="3.5" opacity="0.75"/>
      <rect x="30" y="272" width="150" height="7" rx="3.5" opacity="0.55"/>
    </g>
    <rect x="30" y="316" width="240" height="40" rx="6" fill="#C8841E"/>
    <text x="150" y="341" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#0A0A0B">REPLY TO YOUR COACH</text>
  </g>
  <!-- ember sparks -->
  <g fill="#E8A33D">
    <circle cx="120" cy="70" r="2" opacity="0.7"/><circle cx="700" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="620" cy="540" r="2.2" opacity="0.6"/><circle cx="200" cy="530" r="1.4" opacity="0.5"/>
    <circle cx="400" cy="60" r="1.8" opacity="0.6"/><circle cx="760" cy="320" r="1.5" opacity="0.4"/>
  </g>
</svg>
